name: ci

on:
  push:
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e ".[all]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest
      - name: End-to-end smoke lifecycle
        run: |
          rv-prepare --config configs/smoke.yaml
          rv-train --config configs/smoke.yaml
          rv-evaluate --config configs/smoke.yaml --checkpoint runs/smoke/checkpoints/best.pt
          rv-export --config configs/smoke.yaml --checkpoint runs/smoke/checkpoints/best.pt --output-dir artifacts/smoke
          rv-benchmark --config configs/smoke.yaml --model artifacts/smoke/model.torchscript.pt --backend torchscript --output runs/smoke/benchmark_torchscript.json
          rv-benchmark --config configs/smoke.yaml --model artifacts/smoke/model.onnx --backend onnxruntime --output runs/smoke/benchmark_onnxruntime.json
      - name: Compare two architectures
        run: |
          rv-train --config configs/smoke.yaml --set experiment.name=smoke_lite --set model.architecture=lite_fcn
          rv-benchmark --config configs/smoke.yaml --set experiment.name=smoke_lite --set model.architecture=lite_fcn --model runs/smoke_lite/checkpoints/best.pt --backend pytorch --output runs/smoke_lite/benchmark.json
          rv-benchmark --config configs/smoke.yaml --model runs/smoke/checkpoints/best.pt --backend pytorch --output runs/smoke/benchmark.json
          rv-compare --result tiny_unet=runs/smoke/benchmark.json --result lite_fcn=runs/smoke_lite/benchmark.json --output-prefix runs/comparison
